
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>JARVIS Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#edf4ff;font-family:system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:22px 16px;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:24px 0}
.orb{width:76px;height:76px;border:2px solid #42d9ff;border-radius:50%;margin:auto;display:grid;place-items:center;color:#62e4ff;font-size:30px;box-shadow:0 0 28px #159fc655}
h1{letter-spacing:5px}
.panel{background:#111b2b;border:1px solid #24344c;border-radius:16px;padding:16px;margin:10px 0}
input,textarea,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #334761}
input,textarea{background:#091321;color:white;width:100%;margin:6px 0}
button{background:#123b54;color:white;cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#087fa4;border:0;width:100%}
.muted{color:#93a8c4}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.msg{padding:12px;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#12354a}.ai{background:#172235}
#messages{min-height:180px;max-height:45vh;overflow:auto}
#status{color:#91dff5;font-size:14px}
footer{margin-top:auto;padding:18px 0;text-align:center}
</style>
</head>
<body>
<main>
<header>
<div class="orb">✦</div>
<h1>JARVIS</h1>
<div class="muted">PERSONAL ASSISTANT · DEMO</div>
<p id="status">Έτοιμος</p>
</header>

<section id="login" class="panel hidden">
<h3>Σύνδεση</h3>
<form id="loginForm">
<input id="password" type="password" placeholder="Κωδικός πρόσβασης" required>
<button class="primary" type="submit">Σύνδεση</button>
</form>
<p id="loginError"></p>
</section>

<section id="app">
<div class="row">
<button id="voice" type="button">🎙️ Μίλα</button>
<button id="speak" type="button">🔊 Ομιλία: OFF</button>
<button id="clear" type="button">Καθαρισμός</button>
</div>

<div id="messages" class="panel">
<div class="msg ai">Γεια σου! Είμαι ο JARVIS Demo. Γράψε «βοήθεια» για τις διαθέσιμες λειτουργίες.</div>
</div>

<form id="chatForm" class="panel">
<textarea id="message" rows="3" maxlength="8000" placeholder="Γράψε ένα μήνυμα…" required></textarea>
<button class="primary" id="send" type="submit">Αποστολή ➤</button>
</form>
</section>

<footer class="muted">JARVIS Demo · Χωρίς εξωτερικό AI API</footer>
</main>

<script>
const $ = id => document.getElementById(id);
let speaking = false;
let busy = false;

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  d.textContent = text;
  $("messages").appendChild(d);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function reply(message) {
  const m = message.toLocaleLowerCase("el-GR").trim();

  if (/^(geia|γειά|γεια|hello|hi)(\s|$|!|\.|,)/i.test(m) ||
      /^(γεια σου|καλημέρα|καλησπέρα|καληνύχτα)$/.test(m)) {
    return "Γεια σου φίλε! Είμαι ο JARVIS Demo και λειτουργώ χωρίς εξωτερικό AI API.";
  }

  if (m.includes("ποιος είσαι") || m.includes("τι είσαι")) {
    return "Είμαι ο JARVIS Demo, μια απλή προσομοίωση προσωπικού βοηθού.";
  }

  if (m.includes("βοήθεια") || m.includes("τι μπορείς")) {
    return "Μπορώ να απαντώ σε χαιρετισμούς, να σου λέω ώρα και ημερομηνία και να διαβάζω τις απαντήσεις δυνατά. Δεν διαθέτω πραγματικό AI μοντέλο ή ζωντανή αναζήτηση.";
  }

  if (m.includes("τι ώρα") || m.includes("ώρα τώρα")) {
    return "Η ώρα στην Ελλάδα είναι " +
      new Date().toLocaleTimeString("el-GR", {timeZone:"Europe/Athens"}) + ".";
  }

  if (m.includes("ημερομηνία") || m.includes("τι μέρα")) {
    return "Σήμερα είναι " +
      new Date().toLocaleDateString("el-GR", {
        timeZone:"Europe/Athens",
        dateStyle:"full"
      }) + ".";
  }

  if (m.includes("ευχαριστώ")) {
    return "Παρακαλώ φίλε!";
  }

  if (m.includes("καιρός")) {
    return "Δεν έχω πρόσβαση σε ζωντανά δεδομένα καιρού σε αυτή την έκδοση.";
  }

  return "Έλαβα το μήνυμά σου: «" + message + "».\n\nΕίμαι σε λειτουργία Demo και χρησιμοποιώ προκαθορισμένες απαντήσεις, όχι πραγματικό AI. Γράψε «βοήθεια» για να δεις τι μπορώ να κάνω.";
}

$("chatForm").addEventListener("submit", e => {
  e.preventDefault();
  if (busy) return;

  const text = $("message").value.trim();
  if (!text) return;

  busy = true;
  $("send").disabled = true;
  $("message").value = "";
  add("user", text);
  $("status").textContent = "Ο JARVIS απαντά…";

  try {
    const answer = reply(text);
    add("assistant", answer);
    $("status").textContent = "JARVIS Demo online";

    if (speaking && "speechSynthesis" in window) {
      const utterance = new SpeechSynthesisUtterance(answer);
      utterance.lang = "el-GR";
      speechSynthesis.speak(utterance);
    }
  } catch (error) {
    add("assistant", "Παρουσιάστηκε σφάλμα.");
  } finally {
    busy = false;
    $("send").disabled = false;
    $("message").focus();
  }
});

$("clear").addEventListener("click", () => {
  $("messages").replaceChildren();
});

$("speak").addEventListener("click", () => {
  speaking = !speaking;
  $("speak").textContent = "🔊 Ομιλία: " + (speaking ? "ON" : "OFF");
  if (!speaking && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
});

$("voice").addEventListener("click", () => {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    $("status").textContent = "Η φωνητική εισαγωγή δεν υποστηρίζεται σε αυτόν τον browser.";
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "el-GR";
  recognition.onresult = e => {
    $("message").value = e.results[0][0].transcript;
    $("message").focus();
  };
  recognition.onerror = () => {
    $("status").textContent = "Δεν έγινε αναγνώριση φωνής.";
  };
  recognition.start();
  $("status").textContent = "Σε ακούω…";
});
</script>
</body>
</html>
